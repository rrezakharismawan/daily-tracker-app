<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Worklog & Progress Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- SECTION 1: DAILY PROGRESS BAR -->
    <div class="card progress-section">
      <div class="progress-header">
        <h2>Daily progress bar</h2>
        <span class="info-text">
          By Default 480 Menit = 32 Poles = 100% | 
          Total Aktif: <strong id="total-minutes-label">0</strong> Menit = <strong id="total-poles-label">0</strong> Poles = <strong id="total-percent-label">0%</strong>
        </span>
      </div>

      <!-- Container Multi-Bar -->
      <div class="progress-bar-wrapper">
        <div id="bar-sekunder" class="bar bar-sekunder" style="width: 0%;">
          <span id="label-sekunder">0%</span>
        </div>
        <div id="bar-murni" class="bar bar-murni" style="width: 0%;">
          <span id="label-murni">0%</span>
        </div>
      </div>
    </div>

    <!-- SECTION 2: GRID NOTES & TODAY TASK -->
    <div class="main-grid">
      
      <!-- NOTES LOG OUTPUT -->
      <div class="card notes-section">
        <div class="card-header">
          <h3>Notes :</h3>
          <button id="btn-clock" class="btn-clock">⏱️ Clock Start/Stop</button>
        </div>
        <div id="notes-list" class="notes-list">
          <!-- Item Log akan muncul di sini -->
        </div>
      </div>

      <!-- TODAY TASK NOTEPAD -->
      <div class="card task-section">
        <div class="card-header">
          <h3>Today Task :</h3>
          <div class="editor-toolbar">
            <button onclick="execCmd('bold')"><b>B</b></button>
            <button onclick="execCmd('italic')"><i>I</i></button>
            <button onclick="execCmd('underline')"><u>U</u></button>
            <button onclick="execCmd('strikeThrough')"><s>S</s></button>
          </div>
        </div>
        <div id="today-task-editor" class="editor-content" contenteditable="true" placeholder="Tulis atau paste task di sini..."></div>
      </div>

    </div>

    <!-- SECTION 3: FORM INPUT LOG BARU -->
    <div class="card input-section">
      <div class="form-row">
        <div class="form-group">
          <label>Waktu (HH.MM - HH.MM)</label>
          <input type="text" id="input-waktu" placeholder="08.00 - 09.00">
        </div>

        <div class="form-group">
          <label>Job ID</label>
          <input type="text" id="input-job" placeholder="A0566Y8">
        </div>

        <div class="form-group">
          <label>Drop down Menu A</label>
          <select id="select-dropdown-a"></select>
        </div>

        <div class="form-group">
          <label>Drop down Menu B</label>
          <select id="select-dropdown-b"></select>
        </div>

        <div class="form-group readonly">
          <label>Kalkulasi Durasi</label>
          <input type="text" id="calc-durasi" readonly placeholder="0 Menit">
        </div>

        <div class="form-group readonly">
          <label>Nilai Poles (Hasil)</label>
          <input type="text" id="calc-poles" readonly placeholder="0">
        </div>

        <button id="btn-add-log" class="btn-primary">Tambah Log</button>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
